name: Auf Cloudflare Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Zugangsdaten prüfen
        id: creds
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID fehlen – Veröffentlichung übersprungen."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Seite bauen
        if: steps.creds.outputs.present == 'true'
        run: python3 tools/build.py --dist dist
      - name: Veröffentlichen
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vylarisdata --branch=main
