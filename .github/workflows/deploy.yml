name: Prüfen und auf Cloudflare Pages veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund
      - name: Typen prüfen
        run: npm run typecheck
      - name: Seite bauen
        run: npm run build
      - name: Zugangsdaten prüfen
        id: creds
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Veröffentlichung übersprungen (Pull Request oder Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID fehlen)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Veröffentlichen
        if: steps.creds.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=vylarisdata --branch=main
